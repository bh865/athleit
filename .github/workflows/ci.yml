name: CI

# CI runs only when a working branch is merged into `dev` (a push to dev).
# It does not run on feature-branch pushes, pull requests, or main.
on:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dummy public values so the apps can build; nothing here talks to a real backend.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
  EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm # caches the pnpm store

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @athleit/web build

      - name: Bundle mobile (catches pnpm/Metro workspace resolution regressions)
        run: pnpm --filter @athleit/mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export"
        env:
          CI: '1'

  database:
    name: Database tests (hosted test project, optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needs a DEDICATED test project; never point this at a project with real data.
    # Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_TEST_PROJECT_REF, SUPABASE_TEST_DB_PASSWORD.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every table has an RLS test file
        run: bash scripts/check-rls-tests.sh

      - name: Check for test-project credentials
        id: gate
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$TEST_PROJECT_REF" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping database tests: SUPABASE_ACCESS_TOKEN and SUPABASE_TEST_PROJECT_REF are not configured."
          fi

      - name: Link the test project
        if: steps.gate.outputs.run == 'true'
        run: pnpm supabase link --project-ref "$TEST_PROJECT_REF"

      - name: Apply migrations to the test project
        if: steps.gate.outputs.run == 'true'
        run: pnpm supabase db push --remote --yes

      - name: pgTAP tests (each file rolls back)
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/db-test-remote.sh

  e2e:
    name: Playwright e2e (hosted test project, optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same dedicated test project as the database job. Skipped when it is not configured.
    env:
      TEST_PROJECT_URL: ${{ secrets.SUPABASE_TEST_URL }}
      TEST_PROJECT_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for test-project credentials
        id: gate
        run: |
          if [ -n "$TEST_PROJECT_URL" ] && [ -n "$TEST_PROJECT_ANON_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping e2e: SUPABASE_TEST_URL and SUPABASE_TEST_ANON_KEY are not configured."
          fi

      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @athleit/web exec playwright install --with-deps chromium

      - name: Run Playwright
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @athleit/web e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
