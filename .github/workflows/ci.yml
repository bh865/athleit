name: CI

# CI runs only when a working branch is merged into `dev` (a push to dev).
# It does not run on feature-branch pushes, pull requests, or main.
on:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dummy public values so the apps can build; nothing here talks to a real backend.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
  EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm # caches the pnpm store

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @athleit/web build

      - name: Bundle mobile (catches pnpm/Metro workspace resolution regressions)
        run: pnpm --filter @athleit/mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export"
        env:
          CI: '1'

  database:
    name: Supabase migrations and pgTAP (RLS) tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset database (apply migrations and seed)
        run: pnpm db:reset

      - name: pgTAP and RLS tests
        run: pnpm db:test

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
