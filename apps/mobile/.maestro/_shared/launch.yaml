# Starts the app from a clean state through the dev client and gets past the dev-menu intro on both platforms.
appId: com.athleit.app
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd
- openLink: exp+athleit://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
# Android's launcher can swallow the first link while the app is still starting; send it again if the picker shows.
- runFlow:
    when:
      platform: Android
      visible: ".*Development servers.*"
    commands:
      - openLink: exp+athleit://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
# iOS asks before opening the link.
- runFlow:
    when:
      platform: iOS
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ".*(Continue with email|Runtime version|More).*"
    timeout: 90000
# Dev-menu intro (first launch of a dev client): iOS has a Continue button, then the sheet's close control.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      platform: iOS
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      platform: Android
      visible: ".*Runtime version.*"
    commands:
      - tapOn:
          point: 90%,45%
# The app itself may still be loading its bundle behind the dev menu: wait for a real screen.
- extendedWaitUntil:
    visible: ".*(Continue with email|More|Not now).*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
# A session can survive clearState (the iOS Keychain), so sign out when the app starts signed in.
- runFlow:
    when:
      notVisible: "Continue with email"
      visible: "More"
    file: signout.yaml
